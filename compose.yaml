services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowcheck
      POSTGRES_USER: flowcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowcheck_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcheck -d flowcheck"]
      interval: 5s
      timeout: 3s
      retries: 15
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://flowcheck:${POSTGRES_PASSWORD:-flowcheck_local_only}@db:5432/flowcheck
    command: ["python", "-m", "app.seed"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://flowcheck:${POSTGRES_PASSWORD:-flowcheck_local_only}@db:5432/flowcheck
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
